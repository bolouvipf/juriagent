[project]
name = "juriagent"
version = "0.1.0"
description = "Assistant d'information sur le droit foncier au Benin (textes officiels, modeles Meta)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.11.0",
  "python-multipart==0.0.9",
  "httpx==0.28.0",
  "openai>=2.0,<3",
  "rank-bm25==0.2.2",
  "pypdf>=5.4.0",
  "pymupdf>=1.24",
  "python-dotenv==1.0.1",
]

[tool.vercel]
entrypoint = "src.api.main:app"
